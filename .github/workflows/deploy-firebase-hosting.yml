name: Frontend CI/CD to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - vite.config.*
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SYNCFUSION_LICENSE_KEY: ${{ vars.VITE_SYNCFUSION_LICENSE_KEY }}
          VITE_CWA_API_TOKEN: ${{ vars.VITE_CWA_API_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Apply Firebase Hosting site (GitHub Variable)
        env:
          VITE_FIREBASE_HOSTING_SITE: ${{ vars.VITE_FIREBASE_HOSTING_SITE }}
        run: node scripts/apply-firebase-hosting-site.mjs

      - name: Deploy to Firebase Hosting (live → app.wei-yu.com)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEIYU_ENGINEERING_SMART }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
